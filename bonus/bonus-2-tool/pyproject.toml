[project]
name = "robotframework-github-reporter"
version = "0.1.0"
description = "A Robot Framework listener that opens a GitHub issue for each failing test, or comments on its open issue"
readme = "README.md"
authors = [
    { name = "Workshop rehearsal" }
]
requires-python = ">=3.12"
dependencies = [
    "robotframework==7.5",
]

[build-system]
requires = ["uv_build>=0.8.15,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
